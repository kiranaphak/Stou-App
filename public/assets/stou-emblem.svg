<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1008" fill="none">
  <defs>
    <!-- Gold / Ochre gradient matching the official university seal -->
    <linearGradient id="stouSealGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#DFC057" />
      <stop offset="45%" stopColor="#C99824" />
      <stop offset="100%" stopColor="#A07818" />
    </linearGradient>
    
    <!-- Forest Green matching the university brand outline -->
    <linearGradient id="stouSealGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0E783D" />
      <stop offset="100%" stopColor="#004D28" />
    </linearGradient>
  </defs>

  <!-- 1. Topmost Spire Needle (ปลายยอดพุ่มข้าวบิณฑ์) -->
  <path
    d="M384 105
       C383 140 376 175 366 210
       C354 250 338 290 322 330
       C302 380 278 430 252 480
       C218 548 184 620 184 690
       C184 765 240 820 384 845
       C528 820 584 765 584 690
       C584 620 550 548 516 480
       C490 430 466 380 446 330
       C430 290 414 250 402 210
       C392 175 385 140 384 105 Z"
    stroke="#0E783D"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#FFFFFF"
  />

  <!-- Top Point Spire Extension -->
  <path
    d="M384 105 C380 135 368 160 358 180 M384 105 C388 135 400 160 410 180"
    stroke="#0E783D"
    stroke-width="10"
    stroke-linecap="round"
  />
  <path
    d="M384 105 L384 175"
    stroke="#0E783D"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Outer Flame Ridges (หยักบัวเปลวเพลิงข้างซ้ายและขวา) -->
  <g stroke="#0E783D" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ridges -->
    <path d="M280 435 C260 415 235 430 230 455 C222 480 248 495 264 502" />
    <path d="M228 545 C200 530 185 560 195 585 C205 610 235 615 250 605" />
    <path d="M190 655 C160 650 148 685 160 710 C172 735 205 735 220 715" />

    <!-- Right Ridges -->
    <path d="M488 435 C508 415 533 430 538 455 C546 480 520 495 504 502" />
    <path d="M540 545 C568 530 583 560 573 585 C563 610 533 615 518 605" />
    <path d="M578 655 C608 650 620 685 608 710 C596 735 563 735 548 715" />
  </g>

  <!-- 2. Golden Crown Tier & Spire (พระมหาพิชัยมงกุฎยอดบุษบก) -->
  <g fill="url(#stouSealGold)" stroke="#9C7310" stroke-width="2">
    <!-- Very top golden finial -->
    <polygon points="384,295 377,365 391,365" />
    <ellipse cx="384" cy="372" rx="16" ry="7" />
    <polygon points="384,378 366,445 402,445" />

    <!-- Crown Trimmings and triangles -->
    <path d="M358 445 L410 445 L422 478 L346 478 Z" />
    <!-- White diamond inlays -->
    <polygon points="384,395 376,410 392,410" fill="#FFFFFF" stroke="none" />
    <polygon points="384,420 373,436 395,436" fill="#FFFFFF" stroke="none" />
    <circle cx="363" cy="463" r="3.5" fill="#FFFFFF" stroke="none" />
    <circle cx="384" cy="463" r="4" fill="#FFFFFF" stroke="none" />
    <circle cx="405" cy="463" r="3.5" fill="#FFFFFF" stroke="none" />

    <!-- Crown Body Flare (กนกยอดทรงมงกุฎ) -->
    <path d="M336 478 L432 478 L442 510 C416 532 352 532 326 510 Z" />
    <path d="M358 510 C372 528 396 528 410 510 L402 542 C394 550 374 550 366 542 Z" />
    <path d="M326 510 C340 532 340 555 322 568 L340 568 C352 555 352 532 340 510 Z" />
    <path d="M442 510 C428 532 428 555 446 568 L428 568 C416 555 416 532 428 510 Z" />
  </g>

  <!-- 3. Royal Throne with Three Arrows (พระแท่นและพระแสงศรสามองค์) -->
  <g fill="url(#stouSealGold)" stroke="#9C7310" stroke-width="2">
    <!-- Throne Roof & Eaves -->
    <path d="M298 546 L470 546 L482 568 L286 568 Z" />
    <polygon points="286,568 272,550 284,565" />
    <polygon points="482,568 496,550 484,565" />

    <!-- Left & Right Main Pillars -->
    <rect x="292" y="568" width="18" height="152" rx="2" />
    <rect x="458" y="568" width="18" height="152" rx="2" />

    <!-- 3 Horizontal Crossbars -->
    <rect x="310" y="598" width="148" height="13" rx="2" />
    <rect x="310" y="646" width="148" height="13" rx="2" />
    <rect x="310" y="694" width="148" height="13" rx="2" />

    <!-- 3 Arrow Heads on the Left -->
    <g>
      <!-- Top Arrow Head -->
      <polygon points="292,604 238,588 250,604 238,620" />
      <!-- Middle Arrow Head -->
      <polygon points="292,652 238,636 250,652 238,668" />
      <!-- Bottom Arrow Head -->
      <polygon points="292,700 238,684 250,700 238,716" />
    </g>

    <!-- 3 Arrow Fletchings on the Right -->
    <g>
      <!-- Top Fletching -->
      <polygon points="476,594 522,584 508,604 522,624 476,614" />
      <!-- Middle Fletching -->
      <polygon points="476,642 522,632 508,652 522,672 476,662" />
      <!-- Bottom Fletching -->
      <polygon points="476,690 522,680 508,700 522,720 476,710" />
    </g>

    <!-- Throne Pedestal Base & Legs -->
    <polygon points="278,720 490,720 502,740 266,740" />
    <polygon points="282,740 486,740 476,760 292,760" />
    <!-- Small Decorative Throne Feet -->
    <polygon points="295,760 315,760 305,774 285,774" />
    <polygon points="473,760 453,760 463,774 483,774" />
    <polygon points="370,760 398,760 390,772 378,772" />
  </g>

  <!-- 4. Lower Banner (แถบแพรริบบิ้น มหาวิทยาลัยสุโขทัยธรรมาธิราช) -->
  <g>
    <!-- Green outer ribbon frame -->
    <path
      d="M155 798 C265 765, 503 765, 613 798 L636 852 C510 820, 258 820, 132 852 Z"
      fill="#FFFFFF"
      stroke="#0E783D"
      stroke-width="11"
      stroke-linejoin="round"
    />
    <!-- Ribbon Flaps Left & Right -->
    <path
      d="M132 852 L80 774 L155 798 L118 822 Z
         M636 852 L688 774 L613 798 L650 822 Z"
      fill="#FFFFFF"
      stroke="#0E783D"
      stroke-width="8"
      stroke-linejoin="round"
    />
    <!-- Ribbon bottom tail peak -->
    <path
      d="M384 840 L384 880 L360 864 M384 880 L408 864"
      stroke="#0E783D"
      stroke-width="6"
      stroke-linecap="round"
    />
    <!-- Left & Right green flourishes -->
    <path
      d="M80 760 C65 730 85 700 105 715 C118 725 110 750 120 765
         M688 760 C703 730 683 700 663 715 C650 725 658 750 648 765"
      stroke="#0E783D"
      stroke-width="6"
      fill="none"
      stroke-linecap="round"
    />
  </g>

  <!-- 5. Thai Inscription Calligraphy (มหาวิทยาลัย สุโขทัยธรรมาธิราช) -->
  <text
    x="384"
    y="813"
    text-anchor="middle"
    font-size="28"
    font-weight="700"
    fill="#C99824"
    stroke="#9C7310"
    stroke-width="0.8"
    font-family="'IBM Plex Sans Thai', sans-serif"
    letter-spacing="0.5"
  >
    มหาวิทยาลัย
  </text>
  <text
    x="384"
    y="845"
    text-anchor="middle"
    font-size="30"
    font-weight="800"
    fill="#C99824"
    stroke="#9C7310"
    stroke-width="0.9"
    font-family="'IBM Plex Sans Thai', sans-serif"
    letter-spacing="0.5"
  >
    สุโขทัยธรรมาธิราช
  </text>
</svg>
